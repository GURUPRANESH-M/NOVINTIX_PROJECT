spring.application.name=novintix_backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/credit_management_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT
app.jwt.secret=${JWT_SECRET:YourSuperSecretDevelopmentKeyThatIsAtLeast32BytesLongForJwtSigning123!}
app.jwt.expiration-ms=3600000

# Frontend
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

# Admin credentials - LOCAL DEVELOPMENT ONLY
app.admin.email=admin@novintix.com
app.admin.password=Admin@123456789